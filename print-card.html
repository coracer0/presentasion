<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta Tech Art | Axel Coracero</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap');
        
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
        }

        .card-container {
            width: 336px;
            height: 192px;
            position: relative;
            margin-bottom: 40px;
            page-break-inside: avoid;
        }

        /* DISEÑO FRENTE (ANVERSO) - CON DIAGONALES Y CÍRCULOS */
        .card-front {
            width: 100%;
            height: 100%;
            background: #ffffff;
            color: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            position: relative;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        /* Diagonales // en el frente */
        .diagonal-pattern {
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            opacity: 0.05;
            background-image: repeating-linear-gradient(45deg, #000 0, #000 2px, transparent 0, transparent 10px);
        }

        .circle-1 { position: absolute; top: -20px; right: -20px; width: 100px; height: 100px; background: #3b82f633; border-radius: 50%; blur: 20px; filter: blur(25px); }
        .circle-2 { position: absolute; bottom: -30px; left: 10%; width: 80px; height: 80px; background: #8b5cf622; border-radius: 50%; filter: blur(20px); }

        /* DISEÑO ATRÁS (REVERSO) - MÁS VIBRANTE */
        .card-back {
            width: 100%;
            height: 100%;
            background: #0f172a;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid #1e293b;
        }

        /* Diagonales // en la vuelta */
        .diagonal-pattern-back {
            position: absolute;
            inset: 0;
            opacity: 0.1;
            background-image: repeating-linear-gradient(-45deg, #3b82f6 0, #3b82f6 1px, transparent 0, transparent 8px);
        }

        .back-circle-1 { position: absolute; top: 10%; left: 10%; width: 120px; height: 120px; background: radial-gradient(circle, #3b82f655, transparent 70%); border-radius: 50%; }
        .back-circle-2 { position: absolute; bottom: 10%; right: 10%; width: 140px; height: 140px; background: radial-gradient(circle, #8b5cf644, transparent 70%); border-radius: 50%; }

        .qr-wrapper {
            background: white;
            padding: 12px;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.4);
            position: relative;
            z-index: 10;
        }

        @media print {
            body { background: white; padding: 0; margin: 0; }
            .no-print { display: none; }
            .card-container { margin: 20px auto; border: 1px solid #ddd; }
        }
    </style>
</head>
<body>

    <div class="no-print text-center mb-12">
        <h1 class="text-4xl font-black mb-4 gradient-text inline-block">Diseño Tech Artístico</h1>
        <p class="text-slate-400 mb-8 max-w-lg">Añadimos patrones de diagonales // y esferas de color para un diseño más vivo y profesional.</p>
        <button onclick="window.print()" class="bg-gradient-to-r from-blue-600 to-purple-600 text-white font-bold px-10 py-4 rounded-2xl shadow-2xl transition-all hover:scale-105 active:scale-95">
            <i class="fas fa-print mr-2"></i> Mandar a Imprenta
        </button>
    </div>

    <!-- ANVERSO (FRENTE) -->
    <div class="card-container">
        <div class="card-front">
            <div class="diagonal-pattern"></div>
            <div class="circle-1"></div>
            <div class="circle-2"></div>
            
            <div class="relative z-10">
                <h2 style="font-size: 26px; font-weight: 900; letter-spacing: -1px; color: #020617;">Axel Coracero</h2>
                <p style="font-size: 10px; font-weight: 800; color: #3b82f6; text-transform: uppercase; letter-spacing: 3px; margin-top: 5px;">Ingeniero de Software</p>
            </div>
            
            <div class="relative z-10" style="font-size: 10px; color: #475569; font-weight: 600;">
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
                    <div style="width: 14px; height: 14px; background: #3b82f61a; color: #3b82f6; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 8px;"><i class="fas fa-phone"></i></div>
                    52 418 177 4447
                </div>
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
                    <div style="width: 14px; height: 14px; background: #3b82f61a; color: #3b82f6; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 8px;"><i class="fas fa-envelope"></i></div>
                    ax.coracero@gmail.com
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <div style="width: 14px; height: 14px; background: #3b82f61a; color: #3b82f6; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 8px;"><i class="fas fa-globe"></i></div>
                    github.com/coracer0
                </div>
            </div>
        </div>
    </div>

    <!-- REVERSO (ATRÁS) -->
    <div class="card-container">
        <div class="card-back">
            <div class="diagonal-pattern-back"></div>
            <div class="back-circle-1"></div>
            <div class="back-circle-2"></div>
            
            <div class="text-center">
                <div class="qr-wrapper inline-block">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://coracer0.github.io/presentasion/&bgcolor=ffffff" alt="QR Portafolio" style="width: 100px; height: 100px;">
                </div>
                <p style="margin-top: 15px; font-size: 9px; font-weight: 900; letter-spacing: 5px; color: white; text-transform: uppercase;">PORTAFOLIO</p>
                <div style="width: 20px; height: 2px; background: #3b82f6; margin: 6px auto;"></div>
            </div>
        </div>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-text {
            background: linear-gradient(to right, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</body>
</html>
